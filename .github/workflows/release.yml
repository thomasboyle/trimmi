name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump applied to main after a successful release
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FFMPEG_CACHE_DIR: tools/ffmpeg
  INNO_CACHE_DIR: .tools/innosetup
  # Pin for stable cache keys (bump when intentionally upgrading)
  QT_VERSION: "6.12.0"
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip

jobs:
  release:
    name: Build installer & publish
    # Skip the bot version-bump push so releases do not loop
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'chore: bump version'))
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (& .\scripts\version.ps1 -Action get).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Releasing $version (tag v$version)"

      - name: Ensure tag does not already exist
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($remote) {
            throw "Tag $tag already exists. Bump VERSION on main before releasing again."
          }

      - name: Cache FFmpeg tools
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_CACHE_DIR }}
          key: ffmpeg-btbn-win64-gpl-master-v1

      - name: Download FFmpeg tools
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:GITHUB_WORKSPACE $env:FFMPEG_CACHE_DIR
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          $zip = Join-Path $toolsDir "ffmpeg-win64-gpl.zip"
          $urls = @(
            $env:FFMPEG_URL,
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $downloaded = $true
              break
            } catch {
              Write-Warning "Download failed: $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) { throw "Could not download FFmpeg from any mirror" }
          Expand-Archive -Path $zip -DestinationPath $toolsDir -Force
          Remove-Item $zip -Force -ErrorAction SilentlyContinue

      - name: Export FFmpeg path
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:GITHUB_WORKSPACE $env:FFMPEG_CACHE_DIR
          $bin = Get-ChildItem -Path $toolsDir -Recurse -Filter "ffmpeg.exe" |
            Where-Object { $_.DirectoryName -match '[\\/]bin$' } |
            Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe not found under $toolsDir" }
          $binDir = $bin.DirectoryName
          "FFMPEG_BIN=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "FFmpeg tools: $binDir"
          & (Join-Path $binDir "ffmpeg.exe") -version | Select-Object -First 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # aqt 3.3.0 cannot install Qt 6.11+ (repo layout change); use git until 3.4+
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          archives: qtbase qtsvg qttools qtmultimedia
          cache: true

      - name: Setup MSVC + Ninja
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:Path = "$env:FFMPEG_BIN;$env:Path"
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DTRIMMI_RUN_WINDEPLOYQT=OFF

      - name: Build Trimmi
        shell: pwsh
        run: |
          $env:Path = "$env:FFMPEG_BIN;$env:Path"
          cmake --build build --parallel

      - name: Locate Release output directory
        id: outdir
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter Trimmi.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem build -Recurse -Filter Trimmi.exe | Select-Object -First 5 FullName
            throw "Trimmi.exe not found after build"
          }
          $dir = $exe.DirectoryName
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Output dir: $dir"

      - name: Cache Inno Setup
        id: cache-inno
        uses: actions/cache@v4
        with:
          path: ${{ env.INNO_CACHE_DIR }}
          key: innosetup-7.0.2-x64-v1

      - name: Install Inno Setup
        if: steps.cache-inno.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE $env:INNO_CACHE_DIR
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/NORESTART","/ALLUSERS=0","/DIR=`"$dest`"" -Wait
          if (-not (Test-Path (Join-Path $dest "ISCC.exe"))) {
            Get-ChildItem $dest -Recurse | Select-Object -First 20 FullName
            throw "ISCC.exe missing after Inno Setup install in $dest"
          }

      - name: Export Inno Setup path
        shell: pwsh
        run: |
          $iscc = Join-Path $env:GITHUB_WORKSPACE "$env:INNO_CACHE_DIR\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC: $iscc"

      - name: Stage payload and build standalone installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $buildDir = "${{ steps.outdir.outputs.dir }}"
          $env:Path = "$env:FFMPEG_BIN;$env:Path"
          & .\installer\stage_payload.ps1 -Configuration Release -BuildDir $buildDir
          # Prefer cached ISCC over Program Files
          $env:Path = "$(Split-Path $env:ISCC -Parent);$env:Path"
          & .\installer\build_installer.ps1 -Configuration Release -Version $version -SkipStage
          $setup = Join-Path "dist" "TrimmiSetup-$version.exe"
          if (-not (Test-Path $setup)) {
            throw "Expected installer missing: $setup"
          }
          Write-Host "Installer: $setup ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: TrimmiSetup-${{ steps.version.outputs.version }}
          path: dist/TrimmiSetup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trimmi ${{ steps.version.outputs.version }}
          body: |
            ## Trimmi ${{ steps.version.outputs.version }}

            Standalone Windows installer — no separate Qt, FFmpeg, or Visual C++ install required.

            ### Install
            1. Download `TrimmiSetup-${{ steps.version.outputs.version }}.exe`
            2. Run the installer
            3. Launch **Trimmi** from the Start Menu or desktop shortcut
          files: dist/TrimmiSetup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Bump version for next release
        if: ${{ github.event_name == 'push' || inputs.bump != 'none' }}
        id: bump
        shell: pwsh
        run: |
          $part = "${{ github.event_name == 'push' && 'patch' || inputs.bump }}"
          $next = (& .\scripts\version.ps1 -Action bump -Part $part).Trim()
          "next=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Next VERSION on main will be $next"

      - name: Commit and push version bump
        if: ${{ github.event_name == 'push' || inputs.bump != 'none' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION vcpkg.json installer/Trimmi.iss
          if (git diff --cached --quiet) {
            Write-Host "No version files changed; skipping commit"
            exit 0
          }
          $released = "${{ steps.version.outputs.version }}"
          $next = "${{ steps.bump.outputs.next }}"
          git commit -m "chore: bump version to $next after v$released release"
          git pull --rebase origin main
          git push origin HEAD:main
