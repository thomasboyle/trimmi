name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump applied to main after a successful release
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    name: Build installer & publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'chore: bump version'))
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (& .\scripts\version.ps1 -Action get).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Releasing $version (tag v$version)"

      - name: Ensure tag does not already exist
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($remote) {
            throw "Tag $tag already exists. Bump VERSION on main before releasing again."
          }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Trimmi.App/Trimmi.App.csproj', 'Trimmi.Core/Trimmi.Core.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: Trimmi.App/Assets/ffmpeg
          key: ffmpeg-win64-gpl-shared-v1

      - name: Download FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\scripts\get-ffmpeg.ps1

      - name: Cache Inno Setup
        id: cache-inno
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files (x86)\Inno Setup 6
            C:\Program Files\Inno Setup 6
          key: innosetup-choco-v1

      - name: Install Inno Setup
        if: steps.cache-inno.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          Write-Host "ISCC: $iscc"

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: TrimmiSetup-${{ steps.version.outputs.version }}
          path: installer/output/TrimmiSetup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trimmi ${{ steps.version.outputs.version }}
          body: |
            ## Trimmi ${{ steps.version.outputs.version }}

            Standalone Windows installer — WinUI 3 + bundled FFmpeg. No separate runtime install required.

            ### Install
            1. Download `TrimmiSetup-${{ steps.version.outputs.version }}.exe`
            2. Run the installer
            3. Launch **Trimmi** from the Start Menu or desktop shortcut
          files: installer/output/TrimmiSetup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Bump version for next release
        if: ${{ github.event_name == 'push' || inputs.bump != 'none' }}
        id: bump
        shell: pwsh
        run: |
          $part = "${{ github.event_name == 'push' && 'patch' || inputs.bump }}"
          $next = (& .\scripts\version.ps1 -Action bump -Part $part).Trim()
          "next=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Next VERSION on main will be $next"

      - name: Commit and push version bump
        if: ${{ github.event_name == 'push' || inputs.bump != 'none' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION installer/Trimmi.iss Trimmi.App/Package.appxmanifest
          if (git diff --cached --quiet) {
            Write-Host "No version files changed; skipping commit"
            exit 0
          }
          $released = "${{ steps.version.outputs.version }}"
          $next = "${{ steps.bump.outputs.next }}"
          git commit -m "chore: bump version to $next after v$released release"
          git pull --rebase origin main
          git push origin HEAD:main
